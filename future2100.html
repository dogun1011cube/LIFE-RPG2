<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2100년, 인류의 새로운 일상</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="하늘, 바다, 우주까지 이어진 2100년의 도시를 실시간 3D로 렌더링한 투어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Orbit&display=swap">
<style>
/* Layout: full-bleed WebGL stage; glass HUD column hugs the left edge (title, chapter card), chapter rail pinned to the bottom */
:root{
  color-scheme: dark;
  --void:#03050b;
  --glass:rgba(8,14,30,.62);
  --glass-strong:rgba(6,11,24,.8);
  --edge:rgba(160,205,255,.2);
  --edge-hot:rgba(127,208,255,.6);
  --ink:#ecf3ff;
  --ink-dim:#a9bad3;
  --ion:#7fd0ff;
  --amber:#ffc06e;
  --display:"Orbit","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#stage.dragging{cursor:grabbing}

.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.hud::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(90% 55% at 0% 0%,rgba(3,6,14,.55),rgba(3,6,14,0) 70%),linear-gradient(to top,rgba(3,6,14,.45),rgba(3,6,14,0) 140px)}
.masthead{max-width:600px;text-shadow:0 2px 22px rgba(0,0,0,.5)}
.eyebrow{margin:0 0 10px;font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--ion);font-variant-numeric:tabular-nums}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,3.3vw,46px);line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:10px 0 0;font-size:clamp(14px,1.25vw,17px);line-height:1.55;color:var(--ink-dim)}

.card{pointer-events:auto;align-self:start;width:min(390px,100%);box-sizing:border-box;max-height:100%;overflow:auto;
  background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:16px 20px 20px;
  backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
  box-shadow:0 24px 60px rgba(0,0,0,.35);transition:opacity .45s ease,transform .45s ease;scrollbar-width:thin}
.card.swap{opacity:0;transform:translateY(10px)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--display);font-size:11.5px;letter-spacing:.12em;color:var(--ink-dim)}
.telemetry{color:var(--ion);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card h2{margin:12px 0 8px;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.2;text-wrap:balance}
.desc{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink-dim)}
.extra{margin-top:16px}
.extra:empty{display:none}

.routes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.routes li{display:flex;align-items:baseline;gap:10px;font-size:14px}
.routes .lead{flex:1;min-width:12px;border-bottom:1px dotted rgba(160,205,255,.35);transform:translateY(-4px)}
.routes b{font-family:var(--display);font-weight:400;color:var(--amber);font-variant-numeric:tabular-nums}

.board{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.board caption{caption-side:top;text-align:left;font-family:var(--display);font-size:11.5px;letter-spacing:.12em;color:var(--ink-dim);padding-bottom:8px}
.board th{font-weight:500;font-size:11.5px;color:var(--ink-dim);text-align:left;padding:0 8px 7px 0;border-bottom:1px solid var(--edge)}
.board td{padding:7px 8px 7px 0;border-bottom:1px solid rgba(160,205,255,.08);white-space:nowrap}
.board td.time{font-family:var(--display);color:var(--amber)}
.board th:last-child,.board td:last-child{padding-right:0;text-align:right}
.status{display:inline-block;font-size:11.5px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-dim)}
.status.boarding{color:var(--void);background:var(--ion);border-color:transparent;font-weight:600}
.status.flip{animation:flip .55s ease}
@keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:none;opacity:1}}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.stops li{font-size:13px;padding:4px 11px;border:1px solid var(--edge);border-radius:999px;color:var(--ink-dim)}
.stops li.now{border-color:var(--edge-hot);color:var(--ink);background:rgba(127,208,255,.12)}
.ask{margin:16px 0 0;font-family:var(--display);font-size:19px;line-height:1.4;text-wrap:balance}

.rail{pointer-events:auto;display:flex;gap:10px;min-width:0}
.play{flex:none;width:48px;border-radius:12px;border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.play svg{width:16px;height:16px;fill:currentColor}
.chapters{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.chapters::-webkit-scrollbar{display:none}
.chapters li{flex:none}
.chapters button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:7px;align-items:baseline;
  min-width:124px;padding:10px 12px 9px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s,border-color .25s}
.chapters button:hover{border-color:var(--edge-hot)}
.chapters .n{font-family:var(--display);font-size:11px;letter-spacing:.08em;color:var(--ink-dim)}
.chapters .t{font-size:13px;white-space:nowrap}
.chapters .bar{grid-column:1/-1;height:2px;border-radius:2px;background:rgba(160,205,255,.16);overflow:hidden}
.chapters .bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(var(--p,0));background:var(--ion)}
.chapters button[aria-current="true"]{background:var(--glass-strong);border-color:var(--edge-hot)}
.chapters button[aria-current="true"] .n{color:var(--ion)}
.chapters button:focus-visible,.play:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 24px);margin:0;
  font-size:12px;color:var(--ink-dim);text-shadow:0 1px 10px rgba(0,0,0,.6);pointer-events:none}

.loader{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--void);transition:opacity .9s ease}
.loader.done{opacity:0;pointer-events:none}
.loader-inner{text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.loader p{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--ink-dim)}
.loader .meter{width:180px;height:2px;margin:14px auto 0;border-radius:2px;background:rgba(160,205,255,.16);overflow:hidden}
.loader .meter i{display:block;height:100%;width:40%;background:var(--ion);animation:scan 1.3s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

@media (max-width:720px){
  .masthead .lede{display:none}
  h1{font-size:23px}
  .eyebrow{font-size:11px;margin-bottom:6px}
  .card{align-self:end;width:100%;max-height:min(46vh,100%);padding:14px 16px 16px}
  .card h2{font-size:21px;margin:8px 0 6px}
  .desc{font-size:13.5px;line-height:1.6}
  .hint{display:none}
  .chapters button{min-width:112px}
}
@media (prefers-reduced-motion:reduce){
  .card,.loader{transition:none}
  .loader .meter i,.status.flip{animation:none}
}
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="2100년 미래 도시를 실시간 3D로 보여 주는 장면. 드래그해서 시점을 돌릴 수 있습니다."></canvas>

<div class="hud">
  <header class="masthead">
    <p class="eyebrow" id="clock">2100.01.01 · 00:00</p>
    <h1>2100년, 인류의 새로운 일상</h1>
    <p class="lede">하늘, 바다, 우주까지 — 모든 곳이 가까워진 세상</p>
  </header>

  <section class="card" id="card">
    <div class="card-top"><span id="cardNum">01 / 07</span><span class="telemetry" id="telemetry" aria-hidden="true"></span></div>
    <h2 id="cardTitle" aria-live="polite">미래형 고층 건물</h2>
    <p class="desc" id="cardText"></p>
    <div class="extra" id="cardExtra"></div>
  </section>

  <nav class="rail" aria-label="장면 선택">
    <button class="play" id="playBtn" type="button" aria-pressed="true" aria-label="자동 재생 일시정지"></button>
    <ol class="chapters" id="chapters"></ol>
  </nav>
</div>
<p class="hint">드래그해서 둘러보기 · 스크롤로 확대</p>

<div class="loader" id="loader"><div class="loader-inner"><p id="loaderText">2100년을 렌더링하는 중</p><div class="meter"><i></i></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';

const $ = (id) => document.getElementById(id);
function fail(msg){
  $('loaderText').textContent = msg;
  const m = document.querySelector('.loader .meter'); if (m) m.hidden = true;
}
if (!window.THREE || !THREE.EffectComposer || !THREE.UnrealBloomPass){ fail('3D 엔진을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.'); return; }

THREE.ColorManagement.legacyMode = false;
const TAU = Math.PI * 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mobile = Math.min(innerWidth, innerHeight) < 620 || /Mobi|Android/i.test(navigator.userAgent);

// ---------------------------------------------------------------- math & noise
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

function perlin(seed){
  const r = mulberry32(seed), p = new Uint8Array(512), q = [];
  for (let i = 0; i < 256; i++) q[i] = i;
  for (let i = 255; i > 0; i--){ const j = (r() * (i + 1)) | 0; const t = q[i]; q[i] = q[j]; q[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = q[i & 255];
  const g = (h, x, y) => ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
  const f = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const n = (x, y) => {
    let X = Math.floor(x), Y = Math.floor(y); x -= X; y -= Y; X &= 255; Y &= 255;
    const u = f(x), v = f(y);
    const a = p[p[X] + Y], b = p[p[X + 1] + Y], c = p[p[X] + Y + 1], d = p[p[X + 1] + Y + 1];
    return lerp(lerp(g(a, x, y), g(b, x - 1, y), u), lerp(g(c, x, y - 1), g(d, x - 1, y - 1), u), v) * 0.7;
  };
  n.fbm = (x, y, o = 5) => { let s = 0, a = 0.5, fq = 1; for (let i = 0; i < o; i++){ s += a * n(x * fq, y * fq); fq *= 2.03; a *= 0.5; } return s; };
  return n;
}

const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float s=0.0;float a=0.5;for(int i=0;i<5;i++){s+=a*snoise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=0.5;}return s;}
float fbm3(vec3 p){float s=0.0;float a=0.5;for(int i=0;i<3;i++){s+=a*snoise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=0.5;}return s;}
`;

// ---------------------------------------------------------------- renderer & post
const canvas = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false }); }
catch (e){ fail('이 기기에서는 WebGL 3D 렌더링을 쓸 수 없어요.'); return; }
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 1);
const caps = renderer.capabilities;
const ANISO = Math.min(8, caps.getMaxAnisotropy());
let PR = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.75);
const halfOK = caps.isWebGL2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float'));
const rt = new THREE.WebGLRenderTarget(4, 4, { type: halfOK ? THREE.HalfFloatType : THREE.UnsignedByteType, samples: caps.isWebGL2 ? (mobile ? 2 : 4) : 0 });
const composer = new THREE.EffectComposer(renderer, rt);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 12000);
const renderPass = new THREE.RenderPass(new THREE.Scene(), camera);
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.7, 0.5, 0.85);
const FinalShader = {
  uniforms: { tDiffuse: { value: null }, uExposure: { value: 1 }, uFade: { value: 1 }, uTime: { value: 0 }, uVig: { value: 0.3 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uExposure;
    uniform float uFade;
    uniform float uTime;
    uniform float uVig;
    varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * uExposure;
      c = aces(c);
      c = pow(c, vec3(1.0 / 2.2));
      vec2 q = vUv - 0.5;
      c *= 1.0 - uVig * dot(q, q) * 2.2;
      c += (hash(vUv * 931.0 + fract(uTime)) - 0.5) / 160.0;
      c = mix(c, vec3(0.012, 0.016, 0.03), uFade);
      gl_FragColor = vec4(c, 1.0);
    }`
};
const finalPass = new THREE.ShaderPass(FinalShader);
composer.addPass(renderPass); composer.addPass(bloom); composer.addPass(finalPass);
const pmrem = new THREE.PMREMGenerator(renderer);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(PR); renderer.setSize(w, h, false);
  composer.setPixelRatio(PR); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  if (inst && inst.resize) inst.resize();
}

// ---------------------------------------------------------------- textures
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c, srgb = true, repeat = false){
  const t = new THREE.CanvasTexture(c);
  t.encoding = srgb ? THREE.sRGBEncoding : THREE.LinearEncoding;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = ANISO;
  return t;
}
// one tile = 16 x 32 world units: 8 bays of 2 units, 16 floors of 2 units
function facadeTex(seed, o){
  const rnd = mulberry32(seed), W = 512, H = 1024, cols = 8, floors = 16, cw = W / cols, fh = H / floors;
  const [c1, a] = makeCanvas(W, H), [c2, b] = makeCanvas(W, H);
  a.fillStyle = o.frame; a.fillRect(0, 0, W, H);
  b.fillStyle = '#000'; b.fillRect(0, 0, W, H);
  for (let f = 0; f < floors; f++){
    const gy = f * fh + fh * 0.2, gh = fh * 0.7;
    const gr = a.createLinearGradient(0, gy, 0, gy + gh); gr.addColorStop(0, o.glassA); gr.addColorStop(1, o.glassB);
    a.fillStyle = gr; a.fillRect(0, gy, W, gh);
    const band = rnd() < 0.1;
    for (let c = 0; c < cols; c++){
      const x = c * cw;
      a.fillStyle = o.frame; a.fillRect(x, gy, 4, gh);
      if (band || rnd() < o.lit){
        const k = 0.25 + rnd() * 0.75;
        b.fillStyle = rnd() < o.warm
          ? `rgba(255,${200 + rnd() * 35 | 0},${130 + rnd() * 60 | 0},${k})`
          : `rgba(${175 + rnd() * 50 | 0},${220 + rnd() * 30 | 0},255,${k})`;
        b.fillRect(x + 7, gy + 3, cw - 11, gh - 6);
      }
    }
  }
  a.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++){
    const x = 70 + rnd() * (W - 140), g = a.createLinearGradient(x - 70, 0, x + 70, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, `rgba(${o.streak},0.09)`); g.addColorStop(1, 'rgba(0,0,0,0)');

const CAUSTIC = `
float caustic(vec2 uv, float t){
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++){

    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));

function windowFrameGeo(aspect, fov, dist){
  const vh = 2 * dist * Math.tan(THREE.MathUtils.degToRad(fov / 2)), vw = vh * aspect;
  const outer = new THREE.Shape(), W = vw * 1.6, H = vh * 1.6;
  outer.moveTo(-W, -H); outer.lineTo(W, -H); outer.lineTo(W, H); outer.lineTo(-W, H); outer.lineTo(-W, -H);
  const hw = vw * 0.5 * (aspect > 1 ? 0.86 : 0.9), hh = vh * 0.5 * (aspect > 1 ? 0.8 : 0.84), r = Math.min(hw, hh) * 0.3;
  const hole = new THREE.Path();
  hole.moveTo(-hw + r, -hh); hole.lineTo(hw - r, -hh); hole.quadraticCurveTo(hw, -hh, hw, -hh + r); hole.lineTo(hw, hh - r); hole.quadraticCurveTo(hw, hh, hw - r, hh);
  hole.lineTo(-hw + r, hh); hole.quadraticCurveTo(-hw, hh, -hw, hh - r); hole.lineTo(-hw, -hh + r); hole.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  outer.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(outer, { depth: dist * 0.06, bevelEnabled: true, bevelThickness: dist * 0.03, bevelSize: dist * 0.03, bevelSegments: 6, curveSegments: 20 });
  g.translate(0, 0, -dist);
  return g;
}

const DURATION = 18;
const chaptersEl = $('chapters'), chipBtns = [];
CHAPTERS.forEach((c, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.id = 'chapter-' + c.key;
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${c.short}</span><span class="bar"><i></i></span>`;
  b.addEventListener('click', () => go(i));
  li.appendChild(b); chaptersEl.appendChild(li); chipBtns.push(b);
});
const playBtn = $('playBtn');
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 4 2.5z"/></svg>';
function setPlaying(v){ playing = v; playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-pressed', String(v)); playBtn.setAttribute('aria-label', v ? '자동 재생 일시정지' : '자동 재생 시작'); }
playBtn.addEventListener('click', () => setPlaying(!playing));

const card = $('card'), telEl = $('telemetry');
let boardTimer = 0;
function setCard(i){
  const c = CHAPTERS[i];
  $('cardNum').textContent = `${String(i + 1).padStart(2, '0')} / ${String(CHAPTERS.length).padStart(2, '0')}`;
  $('cardTitle').textContent = c.title; $('cardText').textContent = c.text;
  $('cardExtra').innerHTML = c.extra ? c.extra() : '';
  chipBtns.forEach((b, j) => { b.setAttribute('aria-current', String(j === i)); b.style.setProperty('--p', j < i ? 1 : 0); });
  chipBtns[i].scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  card.classList.remove('swap');
}
function tickBoard(){
  const pills = document.querySelectorAll('.status[data-row]'); if (!pills.length) return;
  const on = Math.floor(performance.now() / 3200) % pills.length;
  pills.forEach((p, i) => {
    const want = i === on ? '탑승 중' : '정시';
    if (p.textContent !== want){ p.textContent = want; p.classList.toggle('boarding', i === on); p.classList.remove('flip'); void p.offsetWidth; p.classList.add('flip'); }
  });
}
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
function tickClock(){
  const n = new Date(), d = new Date(2100, n.getMonth(), n.getDate());
  $('clock').textContent = `2100.${String(n.getMonth() + 1).padStart(2, '0')}.${String(n.getDate()).padStart(2, '0')} (${DAYS[d.getDay()]}) · ${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`;
}
tickClock(); setInterval(tickClock, 10000);

// ---------------------------------------------------------------- interaction
let yaw = 0, pitch = 0, zoom = 1, yawT = 0, pitchT = 0, zoomT = 1, dragging = false;
const pointers = new Map(); let pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', (e) => { pointers.set(e.pointerId, [e.clientX, e.clientY]); canvas.setPointerCapture(e.pointerId); dragging = true; canvas.classList.add('dragging');
  if (pointers.size === 2){ const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = zoomT; } });
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2){ const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0 > 0) zoomT = clamp(zoom0 * pinch0 / d, 0.55, 1.6); return; }
  yawT -= (e.clientX - px) * 0.0045; pitchT = clamp(pitchT + (e.clientY - py) * 0.0035, -0.6, 0.6);
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (!pointers.size){ dragging = false; canvas.classList.remove('dragging'); } pinch0 = 0; };
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoomT = clamp(zoomT * Math.exp(e.deltaY * 0.001), 0.55, 1.6); }, { passive: false });
canvas.addEventListener('dblclick', () => { yawT = pitchT = 0; zoomT = 1; });
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(idx + 1); else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.key === ' ' && e.target === canvas){ e.preventDefault(); setPlaying(!playing); }
});
addEventListener('resize', resize);

// ---------------------------------------------------------------- loop
const built = [];
let inst = null, idx = 0, local = 0, progress = 0, playing = true, fade = 1, pending = null, last = performance.now(), clock = 0;
const camO = { pos: new THREE.Vector3(), target: new THREE.Vector3() }, sph = new THREE.Spherical(), off = new THREE.Vector3();
let perfAcc = 0, perfN = 0;
const lockQuality = /[?&]hq\b/.test(location.search);

function activate(i){
  idx = (i + CHAPTERS.length) % CHAPTERS.length;
  if (!built[idx]) built[idx] = CHAPTERS[idx].build();
  inst = built[idx];
  if (inst.reset) inst.reset();
  local = 0; progress = 0; yaw = yawT = pitch = pitchT = 0; zoom = zoomT = 1;
  camera.fov = inst.fov; camera.near = inst.near; camera.far = inst.far; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (inst.resize) inst.resize();
  [bloom.strength, bloom.radius, bloom.threshold] = inst.bloom;
  finalPass.uniforms.uExposure.value = inst.exposure;
  renderPass.scene = inst.scene;
  place(0.016);
  inst.update(0, 0.016);
  renderer.compile(inst.scene, camera);
  setCard(idx);
  telEl.textContent = inst.telemetry ? inst.telemetry(0) : '';
  perfAcc = perfN = 0;
}
function go(i){
  if (pending !== null) return;
  const n = (i + CHAPTERS.length) % CHAPTERS.length;
  if (n === idx && inst) return;
  pending = n; card.classList.add('swap');
}
function place(dt){
  const k = 1 - Math.exp(-dt * 7);
  yaw += (yawT - yaw) * k; pitch += (pitchT - pitch) * k; zoom += (zoomT - zoom) * k;
  inst.cam(local, camO, dt);
  off.subVectors(camO.pos, camO.target); sph.setFromVector3(off);
  sph.theta += yaw; sph.phi = clamp(sph.phi - pitch, 0.08, Math.PI - 0.08); sph.radius *= zoom;
  off.setFromSpherical(sph);
  camera.position.copy(camO.target).add(off); camera.lookAt(camO.target);
  for (const f of inst.follow) f.position.copy(camera.position);
}
function frame(now){
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(raw, 0.05);
  clock += dt;
  const fdt = Math.min(raw, 0.2);
  if (pending !== null){
    fade = Math.min(1, fade + fdt / 0.5);
    if (fade >= 1){ const n = pending; pending = null; activate(n); last = performance.now(); }
  } else if (inst){ fade = Math.max(0, fade - fdt / 0.9); }
  if (!inst) return;
  const speed = reduceMotion ? 0.35 : 1;
  local += dt * speed;
  if (playing && pending === null && !dragging){
    progress += dt / DURATION;
    if (progress >= 1){ progress = 1; go(idx + 1); }
  }
  chipBtns[idx].style.setProperty('--p', progress.toFixed(3));
  place(dt);
  inst.update(local, dt);
  if ((boardTimer += dt) > 0.25){ boardTimer = 0; tickBoard(); if (inst.telemetry) telEl.textContent = inst.telemetry(local); }
  finalPass.uniforms.uFade.value = fade * fade * (3 - 2 * fade);
  finalPass.uniforms.uTime.value = clock;
  composer.render(dt);
  if (!lockQuality && pending === null){
    perfAcc += raw; perfN++;
    if (perfAcc > 3){
      const fps = perfN / perfAcc;
      if (fps < 30 && PR > 0.8){ PR = Math.max(0.75, PR - 0.25); resize(); for (const b of built) if (b) b.scene.traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uPR) o.material.uniforms.uPR.value = PR; }); }
      perfAcc = perfN = 0;
    }
  }
}

setPlaying(!reduceMotion);
resize();
const startKey = location.hash.replace('#', '');
const startIdx = Math.max(0, CHAPTERS.findIndex(c => c.key === startKey));
requestAnimationFrame(() => setTimeout(() => {
  try {
    activate(startIdx);
  } catch (err){
    console.error(err); fail('장면을 만드는 중 문제가 생겼어요. 새로고침해 주세요.'); return;
  }
  $('loader').classList.add('done');
  last = performance.now();
  requestAnimationFrame(frame);
}, 30));
window.tour = { scene: () => inst && inst.scene, fps: () => perfN / Math.max(perfAcc, 1e-3), go: (k) => go(typeof k === 'number' ? k : CHAPTERS.findIndex(c => c.key === k)) };
})();
</script>
</body>
</html>
